name: Build Android APK & Deploy PWA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Gerar APK Android (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17 (para Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependências e inicializar Capacitor Android
        run: |
          npm install
          npm run build:web
          npx cap add android
          npx cap sync android

      - name: Compilar APK Debug instalável
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publicar APK como Artefato no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Acervo-Homiletico-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
