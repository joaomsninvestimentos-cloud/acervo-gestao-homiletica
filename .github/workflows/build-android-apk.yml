name: Build Android APK & Deploy PWA

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Gerar APK Android (Capacitor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17 (para Android Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK do runner
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK_DIR/build-tools/34.0.0" >> "$GITHUB_PATH"
          echo "sdk.dir=$SDK_DIR" > local.properties

      - name: Instalar plataformas Android
        run: |
          SDKMANAGER=""
          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" || true
          fi

      - name: Restaurar keystore de release
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d ' \r\n' | base64 -d > release.keystore
          chmod 600 release.keystore

      - name: Instalar dependências e inicializar Capacitor Android
        run: |
          npm install
          npm run build:web
          test -f www/index.html
          test -f www/data/acervo-61.js
          test -f www/icons/icon.svg
          test -f www/updater.js
          npx cap add android
          npx cap sync android

      - name: Definir versão Android a partir do package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CODE=$(echo "$VERSION" | awk -F. '{print $1*10000+$2*100+$3}')
          python3 - << PY
          import re
          from pathlib import Path
          p = Path("android/app/build.gradle")
          t = p.read_text()
          t = re.sub(r"versionCode\s+\d+", "versionCode ${CODE}", t, count=1)
          t = re.sub(r'versionName\s+"[^"]+"', 'versionName "${VERSION}"', t, count=1)
          p.write_text(t)
          print("versionName=${VERSION} versionCode=${CODE}")
          PY

      - name: Compilar APK Release
        working-directory: ./android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          chmod +x gradlew
          STORE="$GITHUB_WORKSPACE/release.keystore"
          PASS=$(printf '%s' "$KEYSTORE_PASSWORD" | tr -d ' \r\n')
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$STORE" \
            -Pandroid.injected.signing.store.password="$PASS" \
            -Pandroid.injected.signing.key.alias=acervo \
            -Pandroid.injected.signing.key.password="$PASS"

      - name: Localizar APK gerado
        id: apk
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          ls -la android/app/build/outputs/apk/release || true
          test -n "$APK"

      - name: Publicar APK como Artefato no GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Acervo-Homiletico-Android-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publicar Release GitHub (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp "${{ steps.apk.outputs.path }}" dist/AcervoHomiletico.apk
          NOTES="APK assinado do Acervo Homiletico ${VERSION}. No Poco/Xiaomi (MIUI) o Chrome costuma cortar o download do GitHub Releases. Prefira: https://joaomsninvestimentos-cloud.github.io/acervo-gestao-homiletica/download.html — Se ja tiver a v1.0 (debug), desinstale antes."
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/AcervoHomiletico.apk --clobber --repo "${{ github.repository }}"
            gh release edit "$TAG" --notes "$NOTES" --repo "${{ github.repository }}"
          else
            gh release create "$TAG" dist/AcervoHomiletico.apk \
              --title "v${VERSION} — APK Android" \
              --notes "$NOTES" \
              --repo "${{ github.repository }}"
          fi

      - name: Montar pasta GitHub Pages (PWA + APK direto)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SIZE=$(stat -c%s "${{ steps.apk.outputs.path }}")
          mkdir -p www/apk
          cp "${{ steps.apk.outputs.path }}" www/apk/AcervoHomiletico.apk
          printf '{"version":"%s","apk":"apk/AcervoHomiletico.apk","size":%s,"notes":"Download direto sem GitHub Releases"}\n' "$VERSION" "$SIZE" > www/version.json
          touch www/.nojekyll
          test -f www/download.html
          test -f www/apk/AcervoHomiletico.apk
          ls -lh www/apk www/version.json www/download.html

      - name: Publicar GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./www
          force_orphan: true
